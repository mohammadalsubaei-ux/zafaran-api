<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>البانرات — زعفران</title>
  <link rel="stylesheet" href="admin.css" />
</head>
<body>
  <div class="app-shell">
    <div class="sidebar">
      <div class="sidebar-logo">زعفران</div>
      <div class="sidebar-sub">لوحة الإدارة</div>
      <div id="sidebar-nav"></div>
      <div class="nav-logout">
        <div class="nav-item" onclick="logout()">تسجيل الخروج</div>
      </div>
    </div>

    <div class="main">
      <div class="page-title">بانرات العروض</div>
      <div class="page-sub">تظهر أعلى الصفحة الرئيسية بالتطبيق — المفعل منها فقط، بترتيبك</div>

      <div class="toolbar" style="display:flex;justify-content:flex-end">
        <button class="btn-primary" onclick="openBannerModal()">إضافة بانر</button>
      </div>

      <div id="banners-content" class="loading-state">جاري التحميل...</div>
    </div>
  </div>

  <!-- مودال إضافة/تعديل بانر -->
  <div class="modal-overlay" id="banner-modal">
    <div class="modal-box" style="max-width:520px;width:94%;max-height:88vh;overflow-y:auto">
      <div class="modal-title" id="banner-modal-title">إضافة بانر</div>
      <div class="error-box" id="banner-error"></div>

      <label>العنوان</label>
      <input type="text" id="b-title" placeholder="مثال: خصم 20% على الحلا" />

      <label>الوصف (اختياري)</label>
      <input type="text" id="b-subtitle" placeholder="مثال: هذا الويكند فقط من متاجر القصيم" />

      <div style="display:flex;gap:14px;flex-wrap:wrap">
        <div>
          <label>لون الخلفية</label>
          <input type="color" id="b-bg" value="#3E2410" style="width:90px;height:42px;padding:2px;border-radius:10px;border:1px solid rgba(240,165,0,.3);background:transparent" />
        </div>
        <div>
          <label>لون النص</label>
          <input type="color" id="b-text" value="#FDF0DC" style="width:90px;height:42px;padding:2px;border-radius:10px;border:1px solid rgba(240,165,0,.3);background:transparent" />
        </div>
        <div>
          <label>الترتيب</label>
          <input type="number" id="b-order" value="0" min="0" step="1" style="width:90px;text-align:center" />
        </div>
      </div>

      <label>الوجهة عند الضغط</label>
      <!-- المسارات هنا يجب أن تطابق مسارات expo-router في التطبيق حرفياً -->
      <!-- أي مسار غير موجود = ضغطة بلا استجابة -->
      <select id="b-target" style="width:100%;padding:10px;border-radius:10px;border:1px solid rgba(240,165,0,.3);background:transparent;color:inherit;font-size:14px;margin-bottom:12px">
        <option value="">بدون وجهة</option>
        <option value="/(tabs)/categories?category=all">كل التصنيفات</option>
        <option value="/(tabs)/categories?category=popular">قسم الطبخ</option>
        <option value="/(tabs)/categories?category=sweets">قسم الحلا</option>
        <option value="/(tabs)/categories?category=pastries">قسم المعجنات</option>
        <option value="/(tabs)/categories?category=drinks">قسم القهوة</option>
      </select>

      <div style="font-size:12px;opacity:.65;margin-bottom:6px">معاينة حية:</div>
      <div id="b-preview" style="border-radius:16px;padding:16px;border:1px solid rgba(242,178,51,.15);margin-bottom:14px">
        <div id="b-preview-title" style="font-weight:800;font-size:16px"></div>
        <div id="b-preview-sub" style="font-size:12px;margin-top:5px;opacity:.9"></div>
      </div>

      <div class="modal-actions">
        <button class="btn-ghost" onclick="closeBannerModal()">إلغاء</button>
        <button class="btn-primary" id="banner-submit" onclick="submitBanner()">حفظ</button>
      </div>
    </div>
  </div>

  <script src="admin.js"></script>
  <script>
    const TARGET_AR = {
      "/(tabs)/categories?category=all":      "كل التصنيفات",
      "/(tabs)/categories?category=popular":  "قسم الطبخ",
      "/(tabs)/categories?category=sweets":   "قسم الحلا",
      "/(tabs)/categories?category=pastries": "قسم المعجنات",
      "/(tabs)/categories?category=drinks":   "قسم القهوة",
      // مسارات قديمة غير صالحة — تُعرض بتنبيه حتى يصححها الأدمن
      "/sweets":    "قسم الحلويات (مسار قديم غير صالح)",
      "/pastries":  "قسم المعجنات (مسار قديم غير صالح)",
      "/categories": "التصنيفات (مسار قديم غير صالح)",
    };

    // المسارات الصالحة فقط — أي غيرها يُعرض كتحذير
    const VALID_TARGETS = [
      "/(tabs)/categories?category=all",
      "/(tabs)/categories?category=popular",
      "/(tabs)/categories?category=sweets",
      "/(tabs)/categories?category=pastries",
      "/(tabs)/categories?category=drinks",
    ];

    let editingId = null;

    (async () => {
      const ok = await requireAuth();
      if (!ok) return;

      renderSidebar("banners");
      loadBanners();

      ["b-title", "b-subtitle"].forEach((id) =>
        document.getElementById(id).addEventListener("input", updatePreview));
      ["b-bg", "b-text"].forEach((id) =>
        document.getElementById(id).addEventListener("input", updatePreview));
    })();

    async function loadBanners() {
      const container = document.getElementById("banners-content");
      container.className = "loading-state";
      container.innerHTML = "جاري التحميل...";

      const json = await authFetch("/banners");
      if (!json || !json.success) {
        container.innerHTML = '<div class="empty-state">تعذر تحميل البانرات — تأكد من تشغيل سكربت إنشاء الجدول</div>';
        return;
      }
      if (!json.data || json.data.length === 0) {
        container.innerHTML = '<div class="empty-state">ما فيه بانرات بعد — أضف أول بانر</div>';
        return;
      }

      container.className = "";
      container.innerHTML = json.data.map((b) => {
        const brokenTarget = b.target && !VALID_TARGETS.includes(b.target);

        return `
        <div class="stat-card" style="display:flex;align-items:center;gap:14px;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px">
          <div style="flex:1;min-width:240px;border-radius:14px;padding:14px;border:1px solid rgba(242,178,51,.15);background:${b.bg_color};color:${b.text_color}">
            <div style="font-weight:800;font-size:15px;text-align:right">${escapeHtml(b.title)}</div>
            ${b.subtitle ? `<div style="font-size:12px;margin-top:4px;opacity:.9;text-align:right">${escapeHtml(b.subtitle)}</div>` : ""}
          </div>
          <div style="display:flex;flex-direction:column;gap:6px;font-size:12px;min-width:140px">
            <span>${b.is_active ? '<span class="badge badge-green">معروض</span>' : '<span class="badge badge-red">موقوف</span>'}
              <span style="opacity:.6;margin-inline-start:8px">ترتيب: ${b.sort_order}</span></span>
            <span style="opacity:.6">${b.target ? "الوجهة: " + (TARGET_AR[b.target] || escapeHtml(b.target)) : "بدون وجهة"}</span>
            ${brokenTarget ? '<span style="color:#E57373;font-size:11px">الوجهة لا تعمل — عدّلها واختر وجهة من القائمة</span>' : ""}
          </div>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <button class="btn-ghost" onclick='toggleBanner("${b.id}", ${b.is_active ? "false" : "true"})'>${b.is_active ? "إيقاف" : "تفعيل"}</button>
            <button class="btn-ghost" onclick='openBannerModal(${JSON.stringify(b).replace(/'/g, "&#39;")})'>تعديل</button>
            <button class="btn-ghost" style="border-color:rgba(229,57,53,.5);color:#E57373" onclick='deleteBanner("${b.id}")'>حذف</button>
          </div>
        </div>
      `;
      }).join("");
    }

    function updatePreview() {
      const bg = document.getElementById("b-bg").value;
      const text = document.getElementById("b-text").value;
      const preview = document.getElementById("b-preview");
      preview.style.background = bg;
      preview.style.color = text;
      document.getElementById("b-preview-title").textContent =
        document.getElementById("b-title").value || "عنوان البانر";
      document.getElementById("b-preview-sub").textContent =
        document.getElementById("b-subtitle").value || "";
    }

    function openBannerModal(banner) {
      editingId = banner ? banner.id : null;
      document.getElementById("banner-modal-title").textContent = banner ? "تعديل بانر" : "إضافة بانر";
      document.getElementById("banner-error").style.display = "none";
      document.getElementById("b-title").value = banner ? banner.title : "";
      document.getElementById("b-subtitle").value = banner && banner.subtitle ? banner.subtitle : "";
      document.getElementById("b-bg").value = banner ? banner.bg_color : "#3E2410";
      document.getElementById("b-text").value = banner ? banner.text_color : "#FDF0DC";
      document.getElementById("b-order").value = banner ? banner.sort_order : 0;

      // المسار القديم غير الصالح لا يوجد في القائمة — نتركه فارغاً ليختار الأدمن وجهة صحيحة
      const target = banner && banner.target ? banner.target : "";
      document.getElementById("b-target").value = VALID_TARGETS.includes(target) ? target : "";

      updatePreview();
      document.getElementById("banner-modal").classList.add("open");
    }

    function closeBannerModal() {
      document.getElementById("banner-modal").classList.remove("open");
      editingId = null;
    }

    async function submitBanner() {
      const errorBox = document.getElementById("banner-error");
      const btn = document.getElementById("banner-submit");
      errorBox.style.display = "none";

      const payload = {
        title: document.getElementById("b-title").value.trim(),
        subtitle: document.getElementById("b-subtitle").value.trim() || null,
        bg_color: document.getElementById("b-bg").value,
        text_color: document.getElementById("b-text").value,
        sort_order: parseInt(document.getElementById("b-order").value) || 0,
        target: document.getElementById("b-target").value || null,
      };

      if (!payload.title) {
        errorBox.textContent = "عنوان البانر مطلوب";
        errorBox.style.display = "block";
        return;
      }

      btn.disabled = true;
      btn.textContent = "جاري الحفظ...";

      const json = editingId
        ? await authFetch("/banners/" + editingId, { method: "PATCH", body: JSON.stringify(payload) })
        : await authFetch("/banners", { method: "POST", body: JSON.stringify(payload) });

      btn.disabled = false;
      btn.textContent = "حفظ";

      if (json && json.success) {
        closeBannerModal();
        loadBanners();
      } else {
        errorBox.textContent = (json && json.message) || "تعذر الحفظ";
        errorBox.style.display = "block";
      }
    }

    async function toggleBanner(id, activate) {
      const json = await authFetch("/banners/" + id, {
        method: "PATCH",
        body: JSON.stringify({ is_active: activate === true || activate === "true" }),
      });
      if (json && json.success) loadBanners();
      else alert((json && json.message) || "تعذر التنفيذ");
    }

    async function deleteBanner(id) {
      if (!confirm("حذف هذا البانر نهائياً؟")) return;
      const json = await authFetch("/banners/" + id, { method: "DELETE" });
      if (json && json.success) loadBanners();
      else alert((json && json.message) || "تعذر الحذف");
    }
  </script>
</body>
</html>
