<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>الشيفات — زعفران</title>
  <link rel="stylesheet" href="admin.css" />
</head>
<body>
  <div class="app-shell">
    <div class="sidebar">
      <div class="sidebar-logo">زعفران</div>
      <div class="sidebar-sub">لوحة الإدارة</div>
      <div id="sidebar-nav"></div>
      <div class="nav-logout">
        <div class="nav-item" onclick="logout()">تسجيل الخروج</div>
      </div>
    </div>

    <div class="main">
      <div class="page-title">الشيفات</div>
      <div class="page-sub">كل الشيفات المسجلات بزعفران</div>

      <div id="chefs-content" class="loading-state">جاري التحميل...</div>
    </div>
  </div>

  <script src="admin.js"></script>
  <script>
    (async () => {
      const ok = await requireAuth();
      if (!ok) return;

      renderSidebar("chefs");
      loadChefs();
    })();

    let CERT_GRACE_DAYS = 30;

    async function loadChefs() {
      const container = document.getElementById("chefs-content");

      // مهلة شهادة العمل الحر من إعدادات المنصة (المصدر الوحيد)
      const settings = await authFetch("/settings");
      if (settings && settings.success && Array.isArray(settings.data)) {
        const g = settings.data.find((s) => s.key === "freelance_cert_grace_days");
        if (g) CERT_GRACE_DAYS = parseInt(g.value, 10) || 30;
      }

      const json = await authFetch("/chefs");

      if (!json || !json.success) {
        container.innerHTML = '<div class="empty-state">تعذر تحميل الشيفات</div>';
        return;
      }

      if (!json.data || json.data.length === 0) {
        container.innerHTML = '<div class="empty-state">ما فيه شيفات مسجلات</div>';
        return;
      }

      const rows = json.data
        .map((c) => {
          const statusBadge = c.status === "open"
            ? '<span class="badge badge-green">مفتوح</span>'
            : c.status === "preorder"
            ? '<span class="badge badge-yellow">حجز مسبق</span>'
            : '<span class="badge badge-red">مغلق</span>';

          const certBadge = certStatus(c);

          const verifyBadge = c.is_verified
            ? '<span class="badge badge-green">موثّق</span>'
            : `<button class="btn-small" onclick="verifyChef('${c.id}')">توثيق</button>`;

          return `
            <tr>
              <td>${escapeHtml(c.users?.full_name || "—")}</td>
              <td>${escapeHtml(c.users?.phone || "—")}</td>
              <td>${escapeHtml(c.city || "—")}</td>
              <td>${statusBadge}</td>
              <td>${c.total_orders || 0}</td>
              <td>${money(c.total_earnings)}</td>
              <td>${certBadge}</td>
              <td>${verifyBadge}</td>
            </tr>
          `;
        })
        .join("");

      container.className = "";
      container.innerHTML = `
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>الاسم</th>
                <th>الجوال</th>
                <th>المدينة</th>
                <th>الحالة</th>
                <th>الطلبات</th>
                <th>الأرباح</th>
                <th>شهادة العمل الحر</th>
                <th>التوثيق</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      `;
    }

    function certStatus(c) {
      if (c.freelance_cert_url) {
        const d = c.freelance_cert_uploaded_at
          ? new Date(c.freelance_cert_uploaded_at).toLocaleDateString("ar-SA")
          : "";
        return `<a class="badge badge-green" href="${c.freelance_cert_url}" target="_blank" style="text-decoration:none">عرض${d ? " · " + d : ""}</a>`;
      }
      const created = c.created_at ? new Date(c.created_at).getTime() : Date.now();
      const daysUsed = Math.floor((Date.now() - created) / 86400000);
      const left = CERT_GRACE_DAYS - daysUsed;
      if (left >= 0) return `<span class="badge badge-yellow">متبقي ${left} يوم</span>`;
      return `<span class="badge badge-red">متأخر ${-left} يوم</span>`;
    }

    async function verifyChef(id) {
      if (!confirm("توثيق هذا الشيف؟")) return;
      const json = await authFetch("/chefs/" + id + "/verify", { method: "PATCH" });
      if (json && json.success) {
        loadChefs();
      } else {
        alert((json && json.message) || "تعذر التوثيق");
      }
    }
  </script>
</body>
</html>
